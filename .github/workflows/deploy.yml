# Uploads the site to Altervista by FTP every time you push to the "main" branch.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (GitHub: Settings > Secrets and variables > Actions > New repository secret).
name: Deploy to Altervista

on:
  push:
    branches: [main]
  workflow_dispatch:        # also lets you start it by hand from the "Actions" tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Upload changed files by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # If the connection fails, try one of these (Altervista may want one of them):
          # protocol: ftps
          # port: 21
          server-dir: /          # the folder of your site on the server; change it if your site is inside a subfolder
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config/db.php
            README.md
            whereami.php
            demoAccountsCredentials.md